services:
  # services run as 1000:1000, so ensure the config/data dirs match
  init:
    profiles: [local]
    image: alpine
    user: "0:0"
    volumes:
      - ./data:/data
      - ./config:/config
    command: chown -R 1000:1000 /data /config

  web:
    # start with `docker-compose --profile local up`
    profiles: [local]
    environment:
      # a fresh clone has no config DB; initialize the root login the setup script expects
      ABR_APP__INIT_ROOT_USERNAME: ${ABR_APP__INIT_ROOT_USERNAME:-a}
      ABR_APP__INIT_ROOT_PASSWORD: ${ABR_APP__INIT_ROOT_PASSWORD:-a}
    build:
      context: .
      args:
        - VERSION=local
    volumes:
      - ./config:/config
    ports:
      - "8000:8000"
    depends_on:
      init:
        condition: service_completed_successfully

  psql:
    image: postgres:17
    environment:
      POSTGRES_USER: abr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: audiobookrequest
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    depends_on:
      init:
        condition: service_completed_successfully

  prowlarr:
    profiles: [local]
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/prowlarr:/config
    ports:
      - "9696:9696"
    depends_on:
      init:
        condition: service_completed_successfully

  qbittorrent:
    profiles: [local]
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      WEBUI_PORT: 8081
      TORRENTING_PORT: 6881
    volumes:
      - ./data/qbittorrent:/config
      - ./data/downloads:/downloads
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    depends_on:
      init:
        condition: service_completed_successfully

  # Optional Decypharr (debrid gateway) for torrent results via Prowlarr (Path B).
  # Configure it as a qBittorrent download client in Prowlarr (see README).
  decypharr:
    profiles: [local]
    image: ghcr.io/sirrobot01/decypharr:latest
    volumes:
      - ./data/decypharr:/config
    ports:
      - "8282:8282"
    depends_on:
      init:
        condition: service_completed_successfully

  # Direct (non-tracker) downloads are handed to an aria2 JSON-RPC server.
  # The RPC secret is set via ABR_ARIA2_RPC_SECRET (default `abr-dev-secret`);
  # configure the same secret in ABR under Settings -> Download, with host
  # `aria2`, port `6800`, and base download directory `/downloads`.
  aria2:
    profiles: [local]
    image: p3terx/aria2-pro
    environment:
      RPC_SECRET: ${ABR_ARIA2_RPC_SECRET:-abr-dev-secret}
    volumes:
      # /downloads (host ./tmp/downloads) is where direct downloads land.
      # Point Audiobookshelf's library folder at this directory so its scan
      # picks up newly downloaded books.
      - ./tmp/downloads:/downloads
    ports:
      - "6800:6800"
    depends_on:
      init:
        condition: service_completed_successfully
